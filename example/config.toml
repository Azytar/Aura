# Copy to ~/.config/aura/config.toml. Every section is optional.
# Validate without X11: aura --config-file PATH --check-config
# Unknown keys and invalid values are errors; a rejected reload keeps the old config.

[general]
# Imports are relative to this file. Later imports override earlier ones;
# this file overrides all imports. Tables merge, arrays replace whole arrays.
# import = ["themes/dark.toml", "local.toml"]
live_config_reload = true
sync_timeout_ms = 150            # 1..2000; recover an unfinished TUI update batch

[font]
family = "monospace"             # family name or explicit font file
size = 14.0                      # 6..72 pixels; Ctrl+Plus/Minus zoom, Ctrl+0 resets
letter_spacing = 0               # -16..16; changes cell width
line_spacing = 0                 # -32..32; changes cell height
offset_x = 0                     # -32..32; glyph offset only
offset_y = 0                     # -32..32; glyph offset only
# [font.bold]
# family = "Iosevka"
# style = "Bold"
# [font.italic]
# style = "Italic"               # omitted family uses the primary family
# [font.bold_italic]
# style = "Bold Italic"
# [font.fallback]
# families = ["Noto Sans CJK", "Noto Color Emoji", "Noto Sans Symbols 2"]

[window]
columns = 120                    # startup size; 1..512
lines = 32                       # startup size; 1..256
padding_x = 0
padding_y = 0
title = "Terminal"
class = "AURA Terminal"          # X11 WM_CLASS for window-manager rules
dynamic_title = true             # allow the application to update the title

[colors]
theme = "dark"                   # dark | light | custom; custom starts from dark
# Colors accept "#rrggbb", "#rgb", "rrggbb", "0xrrggbb" or an integer.
# foreground = "#d8d8d8"
# background = "#181818"
# cursor = "#d8d8d8"
# selection = "#406090"
# palette = [                    # exactly 16 ANSI colors: normal, then bright
#   "#000000", "#cd0000", "#00cd00", "#cdcd00", "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
#   "#7f7f7f", "#ff0000", "#00ff00", "#ffff00", "#5c5cff", "#ff00ff", "#00ffff", "#ffffff",
# ]

[cursor]
style = "block"                  # block | underline | bar; TUI cursor sequences override it
blink = true
blink_interval_ms = 500          # 100..2000; typing restarts the interval
blink_timeout_ms = 5000          # 0..60000; 0 keeps blinking while idle

[mouse]
hide_when_typing = true
scroll_lines = 3                 # 1..100; wheel scroll when the application is not tracking
# Shift temporarily gives selection back to Aura in a mouse-aware TUI.

[scrollback]
lines = 10000                    # 0 disables history; maximum 1000000

[keyboard]
use_default_bindings = true
# Ctrl+Shift+C/V copy/paste, Shift+Insert pastes PRIMARY.
# Ctrl+Shift+R reloads. Shift+PageUp/Down and Ctrl+Shift+Home/End scroll the main screen.
# Custom bindings override defaults; the last matching binding wins.
# [[keyboard.bindings]]
# key = "F6"                     # XKB key name or one Unicode character
# mods = "Control|Shift"          # optional; Shift | Alt | Control | Super
# mode = "Main"                  # Any (default) | Main | Alternate
# chars = "example"              # exactly one of chars or action
# [[keyboard.bindings]]
# key = "C"
# mods = "Control|Shift"
# action = "None"                # disable a default binding

[shell]
# Shell, arguments, working directory and env apply to newly started children.
# Without program/args, the existing SHELL selection and login-shell behavior remain.
# program = "/bin/zsh"
# args = ["-l"]
# working_directory = "~/projects"

[env]
# EDITOR = "nvim"                # child-only environment; values must be strings

[security]
osc52 = "write-only"             # write-only | disabled; clipboard reads are never answered
max_paste_bytes = 65536          # 1..1048564; reject oversized pastes as a whole
