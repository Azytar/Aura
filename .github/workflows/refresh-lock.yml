name: Temporary lock refresh

on:
  push:
    branches:
      - 'engineering/stage7-dependency-policy'
    paths:
      - 'crates/aura-text/Cargo.toml'
      - '.github/workflows/refresh-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Regenerate lock and emit it for maintainer import
        run: |
          cargo generate-lockfile
          printf 'AURA_LOCK_B64='
          base64 -w0 Cargo.lock
          printf '\n'
